name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build objc-dap
        run: |
          dotnet restore
          dotnet build
        working-directory: src
      - name: Publish objc-dap
        run: |
          dotnet publish -c Release
          .\bin\Release\net10.0\win-x64\publish\objc-dap.exe --version
        working-directory: src/objc-dap
      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: objc-dap
          path: src/objc-dap/bin/Release/net10.0/win-x64/publish/objc-dap.exe
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: objc-dap.exe
          working_directory: src/objc-dap/bin/Release/net10.0/win-x64/publish/
