name: Build

on:
  push: 
    branches:
      - main
  pull_request:

jobs:
  windows:
    runs-on: ${{ matrix. image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vs2022
            image: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        # Support for Objective C on Windows requires LLVM 18.0 (or preferably 20.0, seehttps://github.com/llvm/llvm-project/pull/107604)
        # For lldb-dap to link with python3.dll (and not python3xx.dll), we need LLVM 21.1.0 or later.
      - name: Check Python version
        run: |
          python --version
          py --list-paths
      - name: Upgrade LLVM
        run: |
          choco upgrade llvm --version=23.1.3 -y
      - name: Check LLVM, Cmake version
        run: |
          clang --version
          cmake --version
          ninja --version
      - name: Install Conan
        run: |
          pip install conan==2.33.0
          conan --version
      - name: Configure Conan
        run: |
          conan config install conan-config
          conan remote list
          conan profile list
      - name: Install libobjcd Dependencies
        run: |
          conan install . -pr:a=windows-clang-vs2022 -of=conan
        working-directory: src/libobjcd
      - name: Configure libobjcd
        run: |
          cmake --preset release
        working-directory: src/libobjcd
      - name: Build libobjcd
        run: |
          cmake --build build
        working-directory: src/libobjcd
      - name: Test libobjcd
        shell: cmd
        run: |
          call conan\conanrun.bat
          ctest --test-dir build --output-on-failure
        working-directory: src/libobjcd
      - name: Build objc-dap
        run: |
          dotnet restore
          dotnet build
        working-directory: src
      - name: Show LLVM, Python 3 version data
        run: |
          dotnet run -- tool-version
        working-directory: src/objc-dap
      - name: Test objc-dap
        run: |
          dotnet test --output detailed
        working-directory: src
      - name: Publish objc-dap
        run: |
          dotnet publish -c Release
          .\bin\Release\net10.0\win-x64\publish\objc-dap.exe --version
        working-directory: src/objc-dap
      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: objc-dap
          path: src/objc-dap/bin/Release/net10.0/win-x64/publish/objc-dap.exe
