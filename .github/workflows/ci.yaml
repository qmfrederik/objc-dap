name: Build

on:
  push: 
    branches:
      - main
  pull_request:

jobs:
  windows:
    runs-on: ${{ matrix. image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vs2022
            image: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check LLVM, Cmake version
        # We need at least LLVM 18.0 for proper Objective C support.  Visual Studio 2022 ships with LLVM 17,
        # so we need to make sure we pick up clang from C:\Program Files\LLVM\bin\
        # For full-fledged support on Windows, we'll need https://github.com/llvm/llvm-project/pull/107604,
        # which will is included in LLVM 20.0.  The windows-2025 GitHub Actions image has this version of clang;
        # trust but verify
        run: |
          clang --version
          cmake --version
          ninja --version
      - name: Install Conan
        run: |
          pip install conan==2.33.0
          conan --version
      - name: Configure Conan
        run: |
          conan config install conan-config
          conan remote list
          conan profile list
      - name: Install libobjcd Dependencies
        run: |
          conan install . -pr:a=windows-clang-vs2022 -of=conan
        working-directory: src/libobjcd
      - name: Configure libobjcd
        run: |
          cmake --preset release
        working-directory: src/libobjcd
      - name: Build libobjcd
        run: |
          cmake --build build
        working-directory: src/libobjcd
      - name: Test libobjcd
        shell: cmd
        run: |
          call conan\conanrun.bat
          ctest --test-dir build --output-on-failure
        working-directory: src/libobjcd
      - name: Build objc-dap
        run: |
          dotnet restore
          dotnet build
        working-directory: src
      - name: Show LLVM, Python 3 version data
        run: |
          dotnet run -- tool-version
        working-directory: src/objc-dap
      - name: Test objc-dap
        run: |
          dotnet test
        working-directory: src
      - name: Publish objc-dap
        run: |
          dotnet publish -c Release
          .\bin\Release\net10.0\win-x64\publish\objc-dap.exe --version
        working-directory: src/objc-dap
      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: objc-dap
          path: src/objc-dap/bin/Release/net10.0/win-x64/publish/objc-dap.exe
