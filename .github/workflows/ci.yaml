name: Build

on:
  push: 
    branches:
      - main
  pull_request:

jobs:
  windows:
    runs-on: ${{ matrix. image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vs2022
            image: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
        # Support for Objective C on Windows requires LLVM 18.0 (or preferably 20.0, seehttps://github.com/llvm/llvm-project/pull/107604)
        # For lldb-dap to link with python3.dll (and not python3xx.dll), we need LLVM 21.1.0 or later.
      - name: Check Python version
        run: |
          python --version
          py --list-paths
      - name: Upgrade LLVM
        run: |
          choco upgrade llvm --version=23.1.3 -y
      - name: Check LLVM, Cmake version
        run: |
          clang --version
          cmake --version
          ninja --version
      - name: Install Conan
        run: |
          pip install conan==2.33.0
          conan --version
      - name: Configure Conan
        run: |
          conan config install conan-config
          conan remote list
          conan profile list
      - name: Install libobjcd Dependencies
        run: |
          conan install . -pr:a=windows-clang-vs2022 -of=conan
        working-directory: src/libobjcd
      - name: Configure libobjcd
        run: |
          cmake --preset release
        working-directory: src/libobjcd
      - name: Build libobjcd
        run: |
          cmake --build build
        working-directory: src/libobjcd
      - name: Test libobjcd
        shell: cmd
        run: |
          call conan\conanrun.bat
          ctest --test-dir build --output-on-failure
        working-directory: src/libobjcd
      - name: Build objc-dap
        run: |
          dotnet restore
          dotnet build
        working-directory: src
      - name: Show LLVM, Python 3 version data
        run: |
          dotnet run -- tool-version
        working-directory: src/objc-dap
      - name: Test objc-dap
        run: |
          dotnet test --output detailed
        working-directory: src
      - name: Publish objc-dap executable
        run: |
          dotnet publish -c Release
          .\bin\Release\net10.0\win-x64\publish\objc-dap.exe --version
        working-directory: src/objc-dap
      - name: Publish objc-dap zip archive
        run: |
          dotnet tool install --global dotnet-zip
          dotnet zip -c Release -r win-x64 -sc
        working-directory: src/objc-dap
      - name: Publish objc-dap executable
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: src/objc-dap/bin/Release/net10.0/win-x64/publish/objc-dap.exe
      - name: Publish objc-dap zip archive
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: src/objc-dap/bin/Release/net10.0/win-x64/objc-dap.*.zip

  linux:
    runs-on: ubuntu-latest
    env:
      CLANG_VERSION: 23
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-26.04
            image: ubuntu:26.04
            family: ubuntu
    steps:
      - name: Add LLVM apt repository (Ubuntu)
        run: |
          apt-get update
          apt-get install -y ca-certificates curl
          install -d /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/keyrings/apt.llvm.org.asc
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-${CLANG_VERSION} main" > /etc/apt/sources.list.d/llvm.list
        if: matrix.family == 'ubuntu'
      - name: Add Kitware apt repository (Ubuntu)
        run: |
          curl -fsSL https://apt.kitware.com/keys/kitware-archive-latest.asc -o /etc/apt/keyrings/kitware-archive.asc
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/kitware-archive.asc] https://apt.kitware.com/ubuntu/ ${VERSION_CODENAME} main" > /etc/apt/sources.list.d/kitware.list
        if: matrix.family == 'ubuntu'
      - name: Install dependencies (Ubuntu)
        run: |
          apt-get update
          apt-get install -y clang-${CLANG_VERSION} lld-${CLANG_VERSION} lldb-${CLANG_VERSION} python3-venv cmake
          # The Conan profile expects /usr/bin/clang and /usr/bin/clang++
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${CLANG_VERSION} 100
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${CLANG_VERSION} 100
        if: matrix.family == 'ubuntu'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - name: Check LLVM, Cmake version
        run: |
          clang --version
          cmake --version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install conan
        run: |
          python3 -m venv .python3/
          .python3/bin/pip install conan==2.33.0
          .python3/bin/conan --version
        working-directory: src/libobjcd/
      - name: Configure Conan
        run: |
          .python3/bin/conan config install ../../conan-config
          .python3/bin/conan remote list
          .python3/bin/conan profile list
        working-directory: src/libobjcd/
      - name: Install libobjcd Dependencies
        run: |
          .python3/bin/conan install . -pr:a=linux-clang-nodist -of=conan
        working-directory: src/libobjcd
      - name: Configure targets
        run: |
          cmake --preset release
        working-directory: src/libobjcd
      - name: Build targets
        run: |
          cmake --build build
        working-directory: src/libobjcd
      - name: Build objc-dap
        run: |
          dotnet restore
          dotnet build
        working-directory: src
      - name: Show LLVM, Python 3 version data
        run: |
          dotnet run -- tool-version
        working-directory: src/objc-dap
      - name: Test objc-dap
        run: |
          dotnet test --output detailed
        working-directory: src
      - name: Publish objc-dap executable
        run: |
          dotnet publish -c Release
          ./bin/Release/net10.0/linux-x64/publish/objc-dap --version
        working-directory: src/objc-dap
      - name: Publish objc-dap tarball
        run: |
          dotnet tool install --global dotnet-tarball
          dotnet tarball -c Release -r linux-x64 -sc
        working-directory: src/objc-dap
      - name: Publish objc-dap executable
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: src/objc-dap/bin/Release/net10.0/linux-x64/publish/objc-dap
      - name: Publish objc-dap zip archive
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: src/objc-dap/bin/Release/net10.0/linux-x64/objc-dap.*.tar.gz
