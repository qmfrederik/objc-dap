name: Build

on:
  push: 
    branches:
      - main
  pull_request:

jobs:
  windows:
    runs-on: ${{ matrix. image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vs2022
            image: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check LLVM, Cmake version
        # We need at least LLVM 18.0 for proper Objective C support.  Visual Studio 2022 ships with LLVM 17,
        # so we need to make sure we pick up clang from C:\Program Files\LLVM\bin\
        # For full-fledged support on Windows, we'll need https://github.com/llvm/llvm-project/pull/107604,
        # which will is included in LLVM 20.0.  The windows-2025 GitHub Actions image has this version of clang;
        # trust but verify
        run: |
          clang --version
          cmake --version
          ninja --version
      - name: Install Conan
        run: |
          pip install conan==2.33.0
          conan --version
      - name: Configure Conan
        run: |
          conan config install conan-config
          conan remote list
          conan profile list
      - name: Install Dependencies
        run: |
          conan install . -pr:a=windows-clang-vs2022 -of=conan
        working-directory: src/libobjcd
      - name: Configure
        run: |
          cmake --preset release
        working-directory: src/libobjcd
      - name: Build
        run: |
          cmake --build build
        working-directory: src/libobjcd
      - name: Test
        shell: cmd
        run: |
          call conan\conanrun.bat
          ctest --test-dir build --output-on-failure
        working-directory: src/libobjcd

